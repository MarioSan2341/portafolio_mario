# Blueprint para Render: Static Site (Vite → dist)
# Docs: https://render.com/docs/static-sites
services:
  - type: web
    name: portafolio-mario
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # URL canónica para meta og:image / twitter (sin barra final). Si usas dominio propio, cámbiala aquí o en el dashboard.
      - key: VITE_SITE_URL
        value: https://portafolio-mario.onrender.com
